<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>관심종목/보유종목 관리</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#0f1420" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="주식리포트" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 40px; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; white-space: nowrap; margin-top: 12px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #e0e0e0; }
  input[type="text"], input[type="number"], input[type="date"], input[type="email"] {
    width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; background: transparent; color: inherit;
  }
  td input { min-width: 90px; }
  button { padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; background: transparent; color: inherit; cursor: pointer; }
  button:hover { background: rgba(127,127,127,0.12); }
  form.add-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
  form.add-form input { width: auto; flex: 1 1 120px; }
  .row-actions { display: flex; gap: 6px; }
  .nav { margin: 24px 0; }
  a { color: inherit; }
  .msg { color: #888; font-size: 0.9em; }
  .error { color: #c62828; }
</style>
</head>
<body>
  <h1>관심종목 / 보유종목 관리</h1>
  <div class="nav"><a href="history.html">← 리포트 히스토리</a></div>

  <section id="loginBox">
    <p>이메일 + 비밀번호로 로그인하세요. (한 번 로그인하면 이 브라우저엔 계속 로그인 상태가 유지됩니다)</p>
    <input id="loginEmail" type="email" placeholder="you@gmail.com" style="margin-bottom:8px;" />
    <input id="loginPassword" type="password" placeholder="비밀번호" style="margin-bottom:8px;" />
    <button id="loginBtn">로그인</button>
    <p class="msg" id="loginMsg"></p>
  </section>

  <section id="appBox" style="display:none">
    <p><span id="whoami" class="msg"></span> · <button id="logoutBtn">로그아웃</button></p>

    <h2>관심종목 (watchlist)</h2>
    <div class="table-scroll">
      <table id="watchlistTable">
        <thead><tr><th>티커</th><th>이름</th><th>내 메모(참고용, 계산엔 안 쓰임)</th><th>활성</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <p style="color:#888; font-size:0.85em;">
      적정 PER·매수 목표가는 더 이상 수동으로 넣지 않습니다 — PEG·지지선·눌림목·추세를 조합한
      "매수 근접도" 점수가 매일 자동으로 계산됩니다 (report.html 참고).
    </p>
    <form class="add-form" id="watchlistForm">
      <input name="ticker" placeholder="TICKER (예: AAPL)" required />
      <input name="display_name" placeholder="이름(선택)" />
      <input name="thesis" placeholder="내 판단/메모(선택)" />
      <button type="submit">추가</button>
    </form>

    <h2>보유종목 (holdings)</h2>
    <div class="table-scroll">
      <table id="holdingsTable">
        <thead><tr><th>티커</th><th>수량</th><th>평단가</th><th>매수일</th><th>메모</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <form class="add-form" id="holdingsForm">
      <input name="ticker" placeholder="TICKER" required />
      <input name="quantity" type="number" step="0.0001" placeholder="수량" required />
      <input name="avg_buy_price" type="number" step="0.01" placeholder="평단가" required />
      <input name="buy_date" type="date" />
      <input name="note" placeholder="메모(선택)" />
      <button type="submit">추가</button>
    </form>
  </section>

  <script src="config.js"></script>
  <script>
    const { url, anonKey } = window.SUPABASE_CONFIG;
    const supabase = window.supabase.createClient(url, anonKey);

    const loginBox = document.getElementById("loginBox");
    const appBox = document.getElementById("appBox");
    const loginMsg = document.getElementById("loginMsg");
    const whoami = document.getElementById("whoami");

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      if (!email || !password) return;
      loginMsg.textContent = "로그인 중...";
      loginMsg.className = "msg";
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        loginMsg.textContent = `실패: ${error.message}`;
        loginMsg.className = "msg error";
      }
      // 성공하면 onAuthStateChange가 알아서 화면을 전환함
    });

    document.getElementById("loginPassword").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabase.auth.signOut();
    });

    supabase.auth.onAuthStateChange((_event, session) => {
      if (session) {
        loginBox.style.display = "none";
        appBox.style.display = "block";
        whoami.textContent = session.user.email;
        loadWatchlist();
        loadHoldings();
      } else {
        loginBox.style.display = "block";
        appBox.style.display = "none";
      }
    });

    // ---------- watchlist ----------
    async function loadWatchlist() {
      const { data, error } = await supabase.from("watchlist").select("*").order("ticker");
      const tbody = document.querySelector("#watchlistTable tbody");
      if (error) {
        tbody.innerHTML = `<tr><td colspan="5" class="error">${error.message}</td></tr>`;
        return;
      }
      tbody.innerHTML = data
        .map(
          (row) => `
        <tr data-id="${row.id}">
          <td>${row.ticker}</td>
          <td><input type="text" class="f-display_name" value="${row.display_name ?? ""}" /></td>
          <td><input type="text" class="f-thesis" value="${row.thesis ?? ""}" /></td>
          <td><input type="checkbox" class="f-active" ${row.active ? "checked" : ""} /></td>
          <td class="row-actions">
            <button class="save-watchlist">저장</button>
            <button class="delete-watchlist">삭제</button>
          </td>
        </tr>`
        )
        .join("");
    }

    document.querySelector("#watchlistTable tbody").addEventListener("click", async (e) => {
      const tr = e.target.closest("tr");
      if (!tr) return;
      const id = tr.dataset.id;
      if (e.target.classList.contains("save-watchlist")) {
        const display_name = tr.querySelector(".f-display_name").value || null;
        const thesis = tr.querySelector(".f-thesis").value || null;
        const active = tr.querySelector(".f-active").checked;
        const { error } = await supabase
          .from("watchlist")
          .update({ display_name, thesis, active })
          .eq("id", id);
        if (error) alert(error.message);
      }
      if (e.target.classList.contains("delete-watchlist")) {
        if (!confirm("삭제할까요?")) return;
        const { error } = await supabase.from("watchlist").delete().eq("id", id);
        if (error) alert(error.message);
        else loadWatchlist();
      }
    });

    document.getElementById("watchlistForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const ticker = f.get("ticker").trim().toUpperCase();
      if (!ticker) return;
      const { error } = await supabase.from("watchlist").insert({
        ticker,
        display_name: f.get("display_name") || null,
        thesis: f.get("thesis") || null,
      });
      if (error) alert(error.message);
      else {
        e.target.reset();
        loadWatchlist();
      }
    });

    // ---------- holdings ----------
    async function loadHoldings() {
      const { data, error } = await supabase.from("holdings").select("*").order("ticker");
      const tbody = document.querySelector("#holdingsTable tbody");
      if (error) {
        tbody.innerHTML = `<tr><td colspan="6" class="error">${error.message}</td></tr>`;
        return;
      }
      tbody.innerHTML = data
        .map(
          (row) => `
        <tr data-id="${row.id}">
          <td>${row.ticker}</td>
          <td><input type="number" step="0.0001" class="f-quantity" value="${row.quantity}" /></td>
          <td><input type="number" step="0.01" class="f-avg_buy_price" value="${row.avg_buy_price}" /></td>
          <td><input type="date" class="f-buy_date" value="${row.buy_date ?? ""}" /></td>
          <td><input type="text" class="f-note" value="${row.note ?? ""}" /></td>
          <td class="row-actions">
            <button class="save-holdings">저장</button>
            <button class="delete-holdings">삭제</button>
          </td>
        </tr>`
        )
        .join("");
    }

    document.querySelector("#holdingsTable tbody").addEventListener("click", async (e) => {
      const tr = e.target.closest("tr");
      if (!tr) return;
      const id = tr.dataset.id;
      if (e.target.classList.contains("save-holdings")) {
        const quantity = tr.querySelector(".f-quantity").value;
        const avg_buy_price = tr.querySelector(".f-avg_buy_price").value;
        const buy_date = tr.querySelector(".f-buy_date").value || null;
        const note = tr.querySelector(".f-note").value || null;
        const { error } = await supabase
          .from("holdings")
          .update({ quantity, avg_buy_price, buy_date, note, updated_at: new Date().toISOString() })
          .eq("id", id);
        if (error) alert(error.message);
      }
      if (e.target.classList.contains("delete-holdings")) {
        if (!confirm("삭제할까요?")) return;
        const { error } = await supabase.from("holdings").delete().eq("id", id);
        if (error) alert(error.message);
        else loadHoldings();
      }
    });

    document.getElementById("holdingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const ticker = f.get("ticker").trim().toUpperCase();
      if (!ticker) return;
      const { error } = await supabase.from("holdings").insert({
        ticker,
        quantity: f.get("quantity"),
        avg_buy_price: f.get("avg_buy_price"),
        buy_date: f.get("buy_date") || null,
        note: f.get("note") || null,
      });
      if (error) alert(error.message);
      else {
        e.target.reset();
        loadHoldings();
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
